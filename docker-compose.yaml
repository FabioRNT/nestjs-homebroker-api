services:
  mongo:
    build: ./.docker/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    ports:
      - 27017:27017

  app:
    build: .
    environment:
      - MONGO_URI=mongodb://root:root@mongo:27017/nest?authSource=admin&directConnection=true
    ports:
      - 3000:3000
    depends_on:
      - mongo
